<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f6fd9" />
<title>Educational Games in Martial Arts Sports</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ================= HOME SCREEN ================= -->
<section id="screen-home" class="screen is-active">
  <div class="home">
    <div class="home__logo-wrap">
      <img id="home-logo" src="logo1.jpg" alt="Martial arts logo" />
    </div>

    <h1 class="home__title" data-i18n="title"></h1>
    <p class="home__subtitle" data-i18n="subtitle"></p>

    <div class="home__divider"></div>
    <p class="home__hint" data-i18n="chooseLanguage"></p>

    <div class="lang-grid">
      <button class="lang-btn lang-btn--en" data-lang="en" type="button">
        <span class="lang-btn__tag">EN</span>
        <span class="lang-btn__text" data-i18n="btnEnglish"></span>
      </button>

      <button class="lang-btn lang-btn--fr" data-lang="fr" type="button">
        <span class="lang-btn__tag">FR</span>
        <span class="lang-btn__text" data-i18n="btnFrench"></span>
      </button>

      <button class="lang-btn lang-btn--ar" data-lang="ar" type="button">
        <span class="lang-btn__tag">ع</span>
        <span class="lang-btn__text" data-i18n="btnArabic"></span>
      </button>
    </div>
  </div>
</section>

<!-- ================= GAMES SCREEN ================= -->
<section id="screen-games" class="screen">
  <header class="topbar">
    <button id="btn-back" class="btn-back" type="button">
      <span class="btn-back__arrow">←</span>
      <span data-i18n="back"></span>
    </button>

    <h2 class="topbar__title" data-i18n="gamesTitle"></h2>

    <div id="lang-switch" class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="ar">ع</button>
    </div>
  </header>

  <div class="filters">
    <div class="filters__search">
      <span class="filters__icon" aria-hidden="true">⌕</span>
      <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" />
    </div>

    <label class="switch">
      <input type="checkbox" id="hide-incomplete" checked />
      <span class="switch__box" aria-hidden="true"></span>
      <span class="switch__label" data-i18n="hideIncomplete"></span>
    </label>

    <span id="count" class="count"></span>
  </div>

  <main id="grid" class="grid"></main>

  <button id="to-top" class="to-top" type="button" aria-label="Top">↑</button>
</section>

<!-- ================= LIGHTBOX ================= -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
  <button id="lightbox-close" class="lightbox__close" type="button" aria-label="Close">✕</button>
  <img id="lightbox-img" class="lightbox__img" src="" alt="" />
  <p id="lightbox-caption" class="lightbox__caption"></p>
</div>

<script src="app.js"></script>
</body>
</html>
